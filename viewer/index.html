<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taiwanese Vocabulary - Digital Page</title>
    <link rel="stylesheet" href="styles.css?v=4">
  </head>
  <body>
    <header class="toolbar">
      <div class="document-title">
        <strong id="document-name">Tai-Japanese Dictionary</strong>
        <span id="frame-name">Frame 26</span>
      </div>

      <div class="segmented" role="group" aria-label="View mode">
        <button type="button" class="is-active" data-mode="facsimile">Facsimile</button>
        <button type="button" data-mode="overlay">Overlay</button>
        <button type="button" data-mode="text">Text</button>
        <button type="button" data-mode="compare">Compare</button>
      </div>

      <div class="toolbar-actions">
        <label class="check-control">
          <input id="show-regions" type="checkbox">
          <span>Regions</span>
        </label>
        <label class="check-control">
          <input id="show-order" type="checkbox">
          <span>Order</span>
        </label>
        <div class="zoom-control" aria-label="Zoom controls">
          <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoom-reset" type="button" title="Reset zoom"><span id="zoom-label">100%</span></button>
          <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="viewer" aria-label="Digital page viewer">
        <div id="viewport" class="viewport">
          <div id="page" class="page mode-facsimile" aria-label="Digitized page">
            <img id="scan" class="scan" src="../samples/1218326/images/1218326_R0000026.jpg" alt="Scanned page from Tai-Japanese Dictionary">
            <svg id="structure-layer" class="structure-layer" aria-hidden="true"></svg>
            <div id="text-layer" class="text-layer"></div>
            <div id="loading" class="loading">Loading XML...</div>
          </div>
          <section id="comparison-view" class="comparison-view" aria-label="OCR comparison" hidden>
            <header class="comparison-header">
              <div>
                <h2>Lite vs CLI</h2>
                <p>Exact agreement is supporting evidence; every difference requires review.</p>
              </div>
              <button id="export-comparison" type="button" class="command-button">Export CSV</button>
            </header>
            <div id="comparison-stats" class="comparison-stats" aria-live="polite"></div>
            <div class="comparison-controls">
              <div class="comparison-filter segmented" role="group" aria-label="Comparison filter">
                <button type="button" class="is-active" data-comparison-filter="all">All</button>
                <button type="button" data-comparison-filter="review">Review</button>
              </div>
              <span id="comparison-count" class="comparison-count"></span>
            </div>
            <div id="comparison-list" class="comparison-list"></div>
            <div id="comparison-loading" class="comparison-loading">Comparing OCR results...</div>
          </section>
        </div>
      </section>

      <aside class="inspector" aria-label="OCR inspector">
        <div class="inspector-header">
          <h1 id="inspector-title">OCR Inspector</h1>
          <button id="export-xml" type="button" class="command-button">Export XML</button>
        </div>

        <label class="field source-field">
          <span>Source page</span>
          <select id="page-select">
            <option value="1218326-26">Tai-Japanese Dictionary · Frame 26</option>
            <option value="1218326-11">Tai-Japanese Dictionary · Frame 11</option>
          </select>
        </label>

        <label class="field source-field ocr-source-field">
          <span>OCR result</span>
          <select id="ocr-select">
            <option value="lite">NDLOCR-Lite · Full scan</option>
          </select>
        </label>

        <label class="field search-field">
          <span>Search</span>
          <input id="search" type="search" placeholder="Text on this page">
        </label>

        <div id="summary" class="summary" aria-live="polite"></div>

        <label class="field threshold-field">
          <span>Minimum confidence <output id="threshold-value">0.00</output></span>
          <input id="threshold" type="range" min="0" max="1" step="0.01" value="0">
        </label>

        <div class="legend" aria-label="Region types">
          <span><i class="legend-main"></i>Body</span>
          <span><i class="legend-note"></i>Interlinear</span>
          <span><i class="legend-block"></i>Ruby / block</span>
        </div>

        <div id="empty-selection" class="empty-selection">Select a text or ruby region</div>

        <form id="line-editor" class="line-editor" hidden>
          <div class="selection-heading">
            <strong id="selection-type">Body</strong>
            <span id="selection-confidence"></span>
          </div>

          <label class="field">
            <span>Recognized text</span>
            <textarea id="line-text" rows="5"></textarea>
          </label>

          <div class="metadata-grid">
            <div><span>Order</span><strong id="selection-order"></strong></div>
            <div><span>Direction</span><strong id="selection-direction"></strong></div>
            <div class="metadata-wide"><span>Bounds</span><strong id="selection-bounds"></strong></div>
          </div>
        </form>
      </aside>
    </main>

    <script src="compare.js?v=2"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
